{{define "styles"}}
<style>
/* kafka-phoenix-ext shared design system.
   Locked decisions, do not drift between pages:
   - one accent (ember), semantic ok/warn/bad, one palette per mode
   - shape scale: panels 10px, controls 6px, badges pill
   - every number is tabular mono; topic names are mono
   - auto light/dark via prefers-color-scheme (wallboard forces dark) */
:root {
  color-scheme: light dark;
  --bg:#f4f5f7; --panel:#ffffff; --inset:#eceef2;
  --text:#16202b; --muted:#5b6a79; --faint:#8a96a3;
  --line:#e1e6ec; --line-strong:#c9d2dc;
  --accent:#c2452f;
  --btn-bg:#b23d28; --btn-fg:#ffffff;
  --ok:#1f7a45; --warn:#8f5f0e; --bad:#bb3523;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#0d1218; --panel:#151c26; --inset:#0f151e;
    --text:#e7ecf2; --muted:#94a1af; --faint:#66727f;
    --line:#232e3c; --line-strong:#35424f;
    --accent:#e0715c;
    --btn-bg:#e0715c; --btn-fg:#1c1210;
    --ok:#4cc284; --warn:#d29a3a; --bad:#e0604c;
  }
}

* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0;
  font:14px/1.55 var(--sans);
  background:var(--bg);
  color:var(--text);
}
::selection { background:color-mix(in srgb, var(--accent) 26%, transparent); }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
[hidden] { display:none !important; }

a { color:var(--accent); text-decoration:none; font-weight:600; }
a:hover { text-decoration:underline; }

.wrap { max-width:1160px; margin:0 auto; padding:22px clamp(14px, 3vw, 28px) 48px; }
.sr-only {
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}
.mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* --- header --- */
.topbar { display:flex; align-items:flex-end; justify-content:space-between; gap:14px 24px; flex-wrap:wrap; }
.brand h1 { font-size:20px; font-weight:650; letter-spacing:-0.01em; margin:0; }
.brand .sub { margin-top:4px; }
.sub { color:var(--muted); font-size:13px; }
.sub b { color:var(--text); font-weight:600; }
.sub span { display:inline-block; margin-right:14px; }
.actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

/* --- buttons --- */
.btn {
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 14px; border-radius:6px;
  border:1px solid var(--line-strong); background:var(--panel); color:var(--text);
  font-family:var(--sans); font-size:13px; font-weight:600; line-height:1.2;
  text-decoration:none; cursor:pointer; white-space:nowrap;
  transition:border-color .15s ease, color .15s ease, background-color .15s ease, filter .15s ease;
}
.btn:hover { border-color:var(--accent); color:var(--accent); text-decoration:none; }
.btn:active { transform:translateY(1px); }
.btn-solid { background:var(--btn-bg); border-color:var(--btn-bg); color:var(--btn-fg); }
.btn-solid:hover { color:var(--btn-fg); filter:brightness(1.08); }

/* --- status pills and badges --- */
.pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap; }
.pill.ok { background:color-mix(in srgb, var(--ok) 14%, transparent); color:var(--ok); }
.pill.bad { background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad); }
.badge {
  display:inline-block; font-size:11px; font-weight:600; padding:1px 8px;
  border-radius:999px; white-space:nowrap; vertical-align:1px;
}
.badge.ok { background:color-mix(in srgb, var(--ok) 14%, transparent); color:var(--ok); }
.badge.warn { background:color-mix(in srgb, var(--warn) 16%, transparent); color:var(--warn); }
.badge.bad { background:color-mix(in srgb, var(--bad) 14%, transparent); color:var(--bad); }
.badge.neutral { background:color-mix(in srgb, var(--muted) 14%, transparent); color:var(--muted); }

/* --- banners --- */
.banner { margin:14px 0 0; padding:11px 14px; border-radius:8px; border:1px solid; font-size:13px; line-height:1.5; }
.banner.bad { background:color-mix(in srgb, var(--bad) 9%, transparent); border-color:color-mix(in srgb, var(--bad) 35%, transparent); color:var(--bad); }
.banner.warn { background:color-mix(in srgb, var(--warn) 10%, transparent); border-color:color-mix(in srgb, var(--warn) 35%, transparent); color:var(--warn); }
.banner .hint { display:block; margin-top:4px; opacity:.9; }

/* --- stat cards --- */
.cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin:18px 0; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
.card .k { color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
.card .v { font-size:20px; font-weight:650; margin-top:3px; font-family:var(--mono); font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.card .v small { font-size:13px; color:var(--muted); font-weight:500; }
.card .v.accent { color:var(--accent); }
.card .d { color:var(--muted); font-size:11.5px; margin-top:2px; }

/* --- broker chips --- */
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 18px; }
.chip {
  display:inline-flex; flex-direction:column; gap:2px;
  background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:8px 12px; color:var(--text); text-decoration:none; min-width:138px;
  transition:border-color .15s ease;
}
a.chip:hover { border-color:var(--accent); text-decoration:none; }
.chip b { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:15px; font-weight:650; }
.chip span { color:var(--muted); font-size:11.5px; }
.chip.hot { border-color:color-mix(in srgb, var(--warn) 60%, var(--line)); }

/* --- tables --- */
.table-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
table { width:100%; min-width:760px; border-collapse:collapse; }
th, td { text-align:left; padding:9px 12px; font-size:13px; border-bottom:1px solid var(--line); vertical-align:top; }
thead th {
  color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase;
  letter-spacing:.06em; white-space:nowrap; background:var(--inset);
}
tbody tr:last-child td { border-bottom:0; }
tbody tr:hover { background:color-mix(in srgb, var(--inset) 55%, transparent); }
td.num, th.num { text-align:right; }
td.num { font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
th a.sortlink { color:inherit; text-decoration:none; font-weight:inherit; }
th a.sortlink:hover { color:var(--accent); text-decoration:none; }
th a.sortlink.active { color:var(--accent); }
.cellsub { display:block; color:var(--muted); font-size:11px; margin-top:2px; font-weight:400; }
.share { display:inline-flex; align-items:center; gap:8px; }
.bar-outer { flex:0 0 84px; background:color-mix(in srgb, var(--accent) 14%, transparent); border-radius:4px; height:6px; overflow:hidden; }
.bar-inner { display:block; background:var(--accent); height:6px; border-radius:4px; }

/* --- search --- */
.search { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.search input[type=search] {
  width:min(340px, 100%); padding:8px 12px;
  border:1px solid var(--line-strong); border-radius:6px;
  background:var(--panel); color:var(--text);
  font-family:var(--sans); font-size:13px;
}
.search input[type=search]::placeholder { color:var(--faint); }
.search .count { color:var(--muted); font-size:12px; font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* --- forms --- */
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin:0 0 18px; }
.panel-h { font-size:13px; font-weight:650; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
.form-grid { display:flex; flex-wrap:wrap; gap:12px 14px; align-items:flex-end; }
.field { display:flex; flex-direction:column; gap:5px; }
.field label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.field input {
  width:170px; max-width:100%; padding:7px 10px;
  border:1px solid var(--line-strong); border-radius:6px;
  background:var(--bg); color:var(--text);
  font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums;
}
.form-note { color:var(--muted); font-size:12px; margin:12px 0 0; line-height:1.5; }

/* --- wallboard tiles --- */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:12px; margin-top:20px; }
.tile {
  display:block; background:var(--panel); border:1px solid var(--line);
  border-radius:10px; padding:14px 16px; min-width:0;
  color:var(--text); text-decoration:none;
  transition:border-color .15s ease;
}
a.tile:hover { border-color:var(--line-strong); text-decoration:none; }
.tile h2 { font-size:14px; font-weight:600; margin:0 0 6px; overflow-wrap:anywhere; line-height:1.4; }
.tile .size { font-size:28px; font-weight:700; letter-spacing:-0.01em; font-family:var(--mono); font-variant-numeric:tabular-nums; }
.tile .bar { background:color-mix(in srgb, var(--accent) 16%, transparent); height:7px; border-radius:4px; margin-top:10px; overflow:hidden; }
.tile .fill { display:block; background:var(--accent); height:7px; border-radius:4px; }
.tile .dets {
  margin-top:10px; color:var(--muted); font-size:12px;
  display:flex; gap:5px 14px; flex-wrap:wrap;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
}
.tile .dets .warn { color:var(--warn); }
.tile .dets .bad { color:var(--bad); }
.tile.alert { border-color:color-mix(in srgb, var(--bad) 55%, var(--line)); }
.tile.watch { border-color:color-mix(in srgb, var(--warn) 55%, var(--line)); }

/* --- misc --- */
.empty { padding:28px 12px; color:var(--muted); font-size:13px; text-align:center; }
.foot { margin-top:22px; color:var(--muted); font-size:12px; line-height:1.6; }

/* --- responsive --- */
@media (max-width: 720px) {
  .topbar { flex-direction:column; align-items:stretch; }
  .actions { width:100%; }
  .search { width:100%; }
  .search input[type=search] { flex:1; width:auto; }
  table { min-width:600px; }
  .col-optional { display:none; }
  .card .v { font-size:18px; }
  .tile .size { font-size:24px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition:none !important; animation:none !important; }
}
</style>
{{end}}
