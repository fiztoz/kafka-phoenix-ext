# Standalone extension egress. This selects the Deployment in this directory
# (app.kubernetes.io/name: kafka-phoenix-ext). It does not select chart-managed
# pods. For a Phoenix chart install with networkPolicy.enabled, apply
# networkpolicy-chart.yaml instead and set the release instance label.
#
# DNS is port 53 only. Destinations are unrestricted for that port because
# cluster DNS VIPs differ; do not widen this to other ports. There is no
# 0.0.0.0/0 rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-phoenix-ext-egress
  namespace: phoenix
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka-phoenix-ext
  policyTypes:
    - Egress
  egress:
    # In-cluster Kafka. External brokers need an ipBlock for that host, not
    # 0.0.0.0/0. Example:
    # - to:
    #     - ipBlock:
    #         cidr: 203.0.113.20/32
    #   ports:
    #     - protocol: TCP
    #       port: 9092
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 9094
    # In-cluster MariaDB in this namespace. Matches Phoenix chart MariaDB
    # pods without pinning the release name. Port 3306 is the documented
    # default. External MariaDB: delete this rule and use only the database
    # host, for example 203.0.113.10/32 port 3306. Do not use 0.0.0.0/0.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mariadb
      ports:
        - protocol: TCP
          port: 3306
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
